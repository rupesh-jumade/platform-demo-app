apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-deployment

spec:
  replicas: 3

  selector:
    matchLabels:
      app: nginx-deployment

  template:
    metadata:
      labels:
        app: nginx-deployment

    spec:
      containers:
      - name: nginx
        image: nginx:latest

        ports:
        - containerPort: 80

        envFrom:
        - configMapRef:
            name: platform-demo-config

        volumeMounts:
        - name: nginx-config-volume
          mountPath: /etc/nginx/conf.d/demo.conf
          subPath: demo.conf

      volumes:
      - name: nginx-config-volume
        configMap:
          name: nginx-config
