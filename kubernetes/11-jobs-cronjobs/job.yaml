apiVersion: batch/v1
kind: Job
metadata:
  name: platform-demo-job
spec:
  backoffLimit: 3

  template:
    metadata:
      labels:
        app: platform-demo-job

    spec:
      restartPolicy: Never

      containers:
        - name: batch-task
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Starting batch task"
              sleep 5
              echo "Batch task completed successfully"
